<style>
/* Layout: workbench — header bar, language/source rail on the left, wide comparison grid on the right; previews always sit on a dark in-game chat strip */
:root{
  --bg:#eef0eb; --surface:#f8f9f6; --raise:#ffffff; --ink:#1d211c; --muted:#646b61; --line:#d8dcd2;
  --accent:#a86d0c; --accent-ink:#ffffff; --accent-soft:#f3e4c4;
  --chat:#1a1c19; --chat-2:#262923; --chat-line:#3a3e36;
  --miss:#c23a3a; --warn:#b06d00; --info:#2f67b0; --ok:#2f7d45; --dirty:#a86d0c;
  --f-display:"Pixelify Sans", "Noto Sans TC", system-ui, sans-serif;
  --f-body:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141613; --surface:#1b1e1a; --raise:#22261f; --ink:#e6e8e1; --muted:#9aa093; --line:#323730;
  --accent:#e2a93f; --accent-ink:#1b1404; --accent-soft:#3a2e15;
  --chat:#0e100d; --chat-2:#171a15; --chat-line:#30352d;
  --miss:#ee6b6b; --warn:#e3a43a; --info:#6fa2ea; --ok:#5fbf7a; --dirty:#e2a93f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141613; --surface:#1b1e1a; --raise:#22261f; --ink:#e6e8e1; --muted:#9aa093; --line:#323730;
  --accent:#e2a93f; --accent-ink:#1b1404; --accent-soft:#3a2e15;
  --chat:#0e100d; --chat-2:#171a15; --chat-line:#30352d;
  --miss:#ee6b6b; --warn:#e3a43a; --info:#6fa2ea; --ok:#5fbf7a; --dirty:#e2a93f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;display:grid;place-items:center;background:var(--chat);color:#ffaa00;font-family:var(--f-display);font-size:24px;font-weight:700;text-shadow:3px 3px 0 #3f2a00;border-radius:4px;flex:none}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.ver{font-size:12px;color:var(--muted);white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);padding:7px 12px;border-radius:6px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ui-lang{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:0 0 0 8px;background:var(--raise);font-size:12px;color:var(--muted)}
.ui-lang select{border:0;background:var(--raise);padding:6px 8px 6px 2px;font-size:13px;color:var(--ink)}
select{color:var(--ink);background-color:var(--raise)}
option,optgroup{color:var(--ink);background-color:var(--raise)}
option:checked{background-color:var(--accent-soft);color:var(--ink)}
#btn-clear{white-space:normal;text-align:left}
.dirty-pill{font-size:12.5px;color:var(--dirty);font-weight:500;padding:5px 11px;border-radius:999px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--dirty) 40%,transparent);white-space:nowrap}
.dirty-pill:hover{border-color:var(--dirty)}
.btn .ic{width:16px;height:16px;flex:none}

.banner{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border:1px dashed var(--accent);border-radius:8px;background:color-mix(in srgb, var(--accent-soft) 55%, transparent);font-size:13.5px}
.banner b{font-weight:700}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1 1 160px;min-width:120px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}

/* layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.06em}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::after{content:"▾";color:var(--muted);font-size:11px}
.panel:not([open])>summary::after{content:"▸"}
.panel .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.count{color:var(--muted);font-weight:400;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}

.lang-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lang-row:first-child{border-top:0}
.lang-code{font-family:var(--f-display);font-size:14px;font-weight:500}
.lang-name{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-bar{grid-column:2/4;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.lang-bar i{display:block;height:100%;background:var(--ok)}
.lang-stat{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.base-tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.base-btn{border:0;background:none;color:var(--muted);font-size:11.5px;padding:0;text-decoration:underline dotted}
.inline-form{display:flex;gap:6px}
.inline-form input{flex:1;min-width:0}
input[type=text],input[type=search],select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink)}
.field select,.field textarea{color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:0}
.file-list{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
.file-item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
.file-item span:first-child{font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;direction:rtl;text-align:left}
.file-item span:last-child{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

/* toolbar */
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--c, var(--muted))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--raise);padding:5px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* table */
.grid-wrap{overflow:auto;max-height:calc(100dvh - 210px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
thead th{position:sticky;top:0;z-index:3;background:var(--raise);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
thead th.kh{left:0;z-index:4}
.th-lang{display:flex;flex-direction:column;gap:3px;min-width:240px}
.th-lang .top-line{display:flex;align-items:baseline;gap:8px}
.th-lang .code{font-family:var(--f-display);font-size:15px}
.th-lang .nm{color:var(--muted);font-size:12px}
.th-lang .lang-bar{height:3px}
tbody th.kcell{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;font-weight:400;vertical-align:top;padding:15px 8px 9px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);width:270px;min-width:220px;max-width:300px}
.khead{display:flex;gap:6px;align-items:flex-start}
.kname{font-family:var(--f-mono);font-size:12.5px;word-break:break-all;line-height:18px;flex:1;min-width:0}
.kname .pre{color:var(--muted)}
.kmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid transparent;line-height:1.5;white-space:nowrap}
.tag.miss{color:var(--miss);background:color-mix(in srgb,var(--miss) 13%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tag.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.tag.dirty{color:var(--dirty);background:color-mix(in srgb,var(--dirty) 15%,transparent)}
.tag.muted{color:var(--muted);border-color:var(--line)}
button.tag{cursor:pointer;font:inherit;font-size:11px}
.row-tools{display:flex;gap:1px;flex:none;margin-top:-3px}
tr[data-k]:not(:hover):not(:focus-within) .row-tools{visibility:hidden}
@media (hover:none){tr[data-k] .row-tools{visibility:visible!important}}
.icon-btn{border:0;background:none;color:var(--muted);font-size:12px;padding:3px;border-radius:4px;display:inline-grid;place-items:center}
.icon-btn .ic{width:15px;height:15px}
.icon-btn.on{color:var(--info)}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn.danger.armed{background:var(--miss);color:#fff}

td.cell{vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line);min-width:240px;max-width:420px;cursor:text;position:relative}
td.cell:hover{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
td.cell.f-miss{box-shadow:inset 3px 0 0 var(--miss)}
td.cell.f-warn{box-shadow:inset 3px 0 0 var(--warn)}
td.cell.f-info{box-shadow:inset 3px 0 0 var(--info)}
td.cell.is-base{background:color-mix(in srgb,var(--accent-soft) 22%,transparent)}
td.cell.editing{background:var(--raise);box-shadow:inset 0 0 0 2px var(--accent)}
.cell-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.cell-tags:empty{display:none}
.chat{background:var(--chat);border-radius:4px;padding:6px 9px;color:#fff;font-family:var(--f-body);font-size:14px;line-height:22px;white-space:pre-wrap;word-break:break-word;letter-spacing:.01em}
.chat .empty{color:#7c8276;font-style:italic;text-shadow:none}
.chat.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12.5px}
.rawv{font-family:var(--f-mono);font-size:12.5px;line-height:22px;white-space:pre-wrap;word-break:break-all;padding:6px 2px}
.tk{border-radius:3px;padding:0 2px;background:color-mix(in srgb,var(--sw, #888) 26%,transparent);box-shadow:inset 0 -2px 0 var(--sw, #888)}
.tk.fmt{background:color-mix(in srgb,var(--muted) 18%,transparent);box-shadow:none}
.ph{display:inline-block;font-family:var(--f-mono);font-size:.82em;padding:0 4px;margin:0 1px;border-radius:3px;background:#3a4a63;color:#cfe0ff;text-shadow:none;line-height:1.4;vertical-align:1px}
.rawv .ph{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:2px;background:var(--sw);box-shadow:0 0 0 1px rgba(255,255,255,.35);margin:0 3px;vertical-align:-1px}
.mk{display:inline-block;width:11px;height:11px;border-radius:2px;background:var(--sw);border:1px solid rgba(255,255,255,.5);margin:0 2px;padding:0;vertical-align:-1px;cursor:pointer}
.mk:hover{transform:scale(1.35)}
.fmk{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;padding:2px 3px;border-radius:2px;background:#3a3e36;color:#c9cdc2;margin:0 2px;vertical-align:1px;text-shadow:none;font-weight:400;font-style:normal;text-decoration:none}

/* usage row */
tr.uses td{background:var(--raise);padding:8px 12px 12px;border-bottom:1px solid var(--line)}
.use-list{display:flex;flex-direction:column;gap:6px;max-width:900px}
.use{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;font-size:12px;border-left:2px solid var(--line);padding-left:10px}
.use .where{color:var(--muted);font-family:var(--f-mono);word-break:break-all}
.use code{font-family:var(--f-mono);font-size:12px;word-break:break-all;white-space:pre-wrap;color:var(--ink)}
.use .ccol{display:inline-flex;align-items:center;gap:4px;font-size:11.5px}
.ccol-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.ccol.edit{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 8px;color:var(--ink)}
.ccol.edit:hover{border-color:var(--accent)}
.kcols{display:inline-flex;align-items:center;gap:1px}
.kcols .sw{margin:0 1px}
.kcols .count{margin-left:3px;font-size:11px}

/* editor */
.swb{width:20px;height:20px;border-radius:3px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);background:var(--sw);padding:0}
.swb:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 30%,transparent)}
.fb{min-width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:12.5px;padding:0 5px;display:inline-grid;place-items:center}
.fb .ic{width:15px;height:15px}
.fb.wide{display:inline-flex;gap:5px;padding:0 9px}
.fb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.edbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--raise);flex:none}
.edbar.off .eb-group{opacity:.45}
.edbar button:disabled{cursor:default}
.eb-group{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.eb-pal{gap:2px}
.edbar .swb.on{outline:2px solid var(--accent);outline-offset:1px}
.eb-hint{margin-left:auto;font-size:12px;color:var(--muted)}
.ed-ce{outline:none;caret-color:#fff;min-height:34px;cursor:text}
.ed-ce.is-empty::before{content:attr(data-ph);color:#7c8276;font-style:italic;pointer-events:none}
.ed-ce.is-empty br{display:none}
.ed-ce .obf-ed{background:rgba(255,255,255,.14);border-radius:2px}
.ed-ce .ph{cursor:default;user-select:all}
.cell textarea#cell-editor{width:100%;display:block;font-family:var(--f-mono);font-size:12.5px;line-height:22px;padding:5px 8px;resize:none;overflow:hidden;min-height:34px}
.ed-pv{margin-top:6px}
td.cell .fill-btn{position:absolute;top:3px;right:3px;z-index:1;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);background:var(--raise);color:var(--muted);border-radius:5px;padding:0;opacity:0;transition:opacity .12s}
td.cell .fill-btn .ic{width:14px;height:14px}
td.cell:hover .fill-btn,td.cell .fill-btn:focus-visible{opacity:1}
td.cell .fill-btn:hover{color:var(--ink);border-color:var(--muted)}
@media (hover:none){td.cell .fill-btn{opacity:.85}}
@keyframes cellflash{0%{box-shadow:inset 0 0 0 3px var(--accent)}100%{box-shadow:inset 0 0 0 3px transparent}}
td.cell.flash{animation:cellflash 1.3s ease-out}
.edfloat{position:fixed;z-index:35;display:flex;gap:6px;padding:4px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
/* projects */
.proj-list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.proj{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:1px;border-radius:6px;padding:1px}
.proj.on{background:var(--accent-soft)}
.proj-open{border:0;background:none;text-align:left;display:flex;flex-direction:column;padding:4px 6px;min-width:0;border-radius:5px}
.proj-open:hover{background:color-mix(in srgb,var(--line) 55%,transparent)}
.proj-name{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-meta{font-size:11.5px;color:var(--muted)}
.proj .icon-btn{visibility:hidden}
.proj:hover .icon-btn,.proj:focus-within .icon-btn,.proj .icon-btn.armed{visibility:visible}
@media (hover:none){.proj .icon-btn{visibility:visible}}
.proj-input{width:100%;min-width:0;margin:2px}
.inline-form.wrap{flex-wrap:wrap}

/* popover & dialogs */
.pop{position:fixed;z-index:50;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px;width:248px;display:flex;flex-direction:column;gap:9px}
.pop h4{margin:0;font-size:12.5px;font-weight:500;color:var(--muted)}
.pop h4 code{font-family:var(--f-mono);color:var(--ink)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pal .swb{width:100%;height:22px}
.pal .swb.on{outline:2px solid var(--accent);outline-offset:1px}
.hexrow{display:flex;gap:6px;align-items:center}
.hexrow input[type=text]{flex:1;min-width:0;font-family:var(--f-mono)}
.hexrow input[type=color]{width:36px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.pop .note{font-size:11.5px;color:var(--muted);margin:0}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,9,.45);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:16px}
.exp-fmt{max-width:320px}
.exp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.exp-row .p{font-family:var(--f-mono);font-size:12px;word-break:break-all}
.exp-row .s{font-size:11.5px;color:var(--muted)}
.exp-row .b{display:flex;gap:6px}
.dialog textarea{width:100%;font-family:var(--f-mono);font-size:12px;min-height:160px}
.err{color:var(--miss);font-size:12.5px;margin:0}
.drop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);border:3px dashed var(--accent);font-size:18px;font-weight:700;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;max-width:calc(100% - 32px)}
.more{padding:12px;text-align:center}
.empty-state{padding:40px 16px;text-align:center;color:var(--muted)}
/* loaded sources */
.sources{display:flex;flex-direction:column;gap:8px}
.src-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.src-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em}
.mode{font-size:12.5px;color:var(--muted)}
.mode b{color:var(--ink);font-weight:500}
.src-grid{display:flex;flex-wrap:wrap;gap:8px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 280px;max-width:100%}
.src.child{border-style:dashed}
.src-top{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;min-width:0}
.src-top .icon-btn{margin-left:auto}
.kind{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;flex:none;letter-spacing:.04em}
.kind.map{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.kind.pack{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.kind.datapack{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.src-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
.src-path{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.src-stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.src-stats b{color:var(--ink);font-weight:500}
.src .chat{font-size:12.5px;padding:4px 8px}
.rel{font-size:11.5px;color:var(--muted)}
.rel b{color:var(--ink);font-weight:500}
.warn-list{display:flex;flex-direction:column;gap:5px}
.wn{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;padding:3px 8px;border-radius:5px;line-height:1.45}
.wn.miss{background:color-mix(in srgb,var(--miss) 11%,transparent);color:var(--ink)}
.wn.warn{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.wn.info{background:color-mix(in srgb,var(--info) 10%,transparent)}
.wn::before{content:"";width:7px;height:7px;border-radius:2px;flex:none;background:var(--c)}
.wn.miss{--c:var(--miss)} .wn.warn{--c:var(--warn)} .wn.info{--c:var(--info)}
.wn span{flex:1 1 auto;min-width:0}
.src-empty{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:12.5px}
@media (min-width:881px){
  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:12px}
  .top,.banner{flex:none}
  .layout{flex:1 1 auto;min-height:0;align-items:stretch;margin-top:12px}
  .side{overflow:auto;min-height:0;padding-bottom:4px}
  .main{min-height:0}
  .sources{flex:none;max-height:26vh;overflow:auto}
  .toolbar,.chips{flex:none}
  .grid-wrap{flex:1 1 auto;min-height:0;max-height:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true">§</div>
    <h1 data-t>翻譯鍵工作台</h1><span class="ver"><span data-t>離線版</span> 1.7</span>
  </div>
  <div class="actions">
    <label class="ui-lang" title="Interface language / 介面語言"><span aria-hidden="true">文A</span><select id="ui-lang" aria-label="Interface language"><option value="zh_tw">繁體中文</option><option value="en">English (US)</option><option value="zh_cn">简体中文</option></select></label>
    <button class="btn" id="btn-lang-files" type="button" title="只載入語言檔（.json / .lang / .yml），不掃描地圖" data-t-title><i data-ic="lang"></i><span data-t>載入語言檔</span></button>
    <button class="btn" id="btn-files" type="button" title="地圖或資源包的 .zip，或個別檔案" data-t-title><i data-ic="upload"></i><span data-t>載入檔案</span></button>
    <button class="btn" id="btn-folder" type="button" title="地圖或資源包資料夾（唯讀）" data-t-title><i data-ic="folder"></i><span data-t>載入資料夾</span></button>
    <button class="btn" id="btn-folder-rw" type="button" hidden title="開啟後修改可以直接寫回原本的語言檔（Chrome / Edge）" data-t-title><i data-ic="folderEdit"></i><span data-t>開啟資料夾並可存回</span></button>
    <button class="btn" id="btn-add-key" type="button" title="新增翻譯鍵" data-t-title><i data-ic="plus"></i><span data-t>新增鍵</span></button>
    <button id="dirty" class="dirty-pill" type="button" hidden title="開啟匯出視窗" data-t-title></button>
    <button class="btn primary" id="btn-export" type="button"><i data-ic="download"></i><span data-t>匯出語言檔</span></button>
    <input id="in-files" type="file" multiple accept=".zip,.json,.lang,.yml,.yaml,.mcfunction,.mca,.mcr,.nbt,.snbt,.dat,.mcmeta" hidden>
    <input id="in-folder" type="file" webkitdirectory directory multiple hidden>
    <input id="in-lang" type="file" multiple accept=".json,.lang,.yml,.yaml" hidden>
  </div>
</header>
<div id="banner" class="banner"></div>

<div class="layout">
  <aside class="side">
    <details class="panel" open id="p-proj"><summary><span data-t>專案</span> <span class="count" id="proj-count"></span></summary>
      <div class="body">
        <div class="proj-list" id="proj-list"></div>
        <div class="inline-form wrap">
          <button class="btn sm" type="button" id="btn-new-proj" title="從空白開始一個新專案" data-t-title><i data-ic="plus"></i><span data-t>新專案</span></button>
          <button class="btn sm" type="button" id="btn-save-session" title="把目前專案存成 .json，可以備份、換電腦或分享" data-t-title><i data-ic="download"></i><span data-t>匯出</span></button>
          <button class="btn sm" type="button" id="btn-open-session" title="把 .json 專案檔匯入成新專案" data-t-title><i data-ic="upload"></i><span data-t>匯入</span></button>
        </div>
        <p class="hint" id="autosave-status"></p>
        <input id="in-session" type="file" accept=".json,application/json" hidden>
      </div>
    </details>
    <details class="panel" open id="p-langs"><summary title="勾選顯示為欄位；「設為基準」的語言用來比對缺漏與未翻譯。" data-t-title><span data-t>語言</span> <span class="count" id="lang-count"></span></summary>
      <div class="body">
        <div id="lang-list"></div>
        <div class="inline-form"><input type="text" id="new-lang" placeholder="新增語言，例如 ko_kr" aria-label="新增語言代碼" data-t-ph data-t-aria><button class="btn sm" type="button" id="btn-new-lang" data-t>新增</button></div>
      </div>
    </details>
    <details class="panel" id="p-src"><summary><span data-t>語言檔</span> <span class="count" id="src-count"></span></summary>
      <div class="body">
        <div class="file-list" id="file-list"></div>
        <p class="hint" id="scan-summary"></p>
        <button class="btn sm ghost" type="button" id="btn-clear" data-t>清除全部</button>
      </div>
    </details>
    <details class="panel" id="p-set"><summary data-t>設定</summary>
      <div class="body">
        <label class="field" title="原版語言檔只支援 § 色碼。hex 顏色寫在地圖的文字元件（SNBT / JSON 的 color）裡，會在每個鍵「用在哪裡」中顯示與修改。" data-t-title><span data-t>格式碼前綴</span>
          <select id="set-prefix"><option value="§" data-t>§（原版）</option><option value="&amp;" data-t>&amp;（插件，同時辨識 §）</option></select>
        </label>
        <label class="field" title="地圖用到原版鍵（例如 block.minecraft.stone）時，遊戲本身已提供翻譯，不必列為未定義。" data-t-title><span data-t>「未定義」檢查略過這些前綴（每行一個）</span>
          <textarea id="set-ignore" rows="5"></textarea>
        </label>
      </div>
    </details>
  </aside>

  <section class="main">
    <section class="sources" id="sources" aria-label="載入內容" data-t-aria></section>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋鍵或文字…" aria-label="搜尋" data-t-ph data-t-aria>
      <select id="prefix" aria-label="鍵前綴" data-t-aria></select>
      <div class="seg" role="group" aria-label="顯示方式" data-t-aria>
        <button type="button" data-view="preview" aria-pressed="true" data-t>遊戲預覽</button>
        <button type="button" data-view="raw" aria-pressed="false" data-t>原始碼</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="edbar off" id="edbar" role="toolbar" aria-label="編輯工具" data-t-aria></div>
    <div class="grid-wrap" id="grid-wrap"><table id="grid"></table></div>
  </section>
</div>

<div id="pop" class="pop" hidden></div>

function setComponentColor(u, value){

const SCAN_KINDS = new Set(['region','func','text','nbt']);
function computeSources(){
  const roots = new Map();
  const add = (root, t) => { let s = roots.get(root); if(!s){ s = {root, tags:new Set()}; roots.set(root, s); } s.tags.add(t); };
  for(const {path, kind} of S.paths){
    if(kind === 'level') add(dirOf(path), 'map');
    const rm = path.match(/^(.*?)\/(?:dimensions\/[^\/]+\/[^\/]+\/|DIM-?1\/)?(?:region|entities)\/[^\/]+\.mc[ar]$/i);
    if(rm) add(rm[1], 'map');
    if(kind === 'lang' && /(^|\/)assets\/[^\/]+\/lang\//i.test(path)){ const i = path.lastIndexOf('assets/'); add(i > 0 ? path.slice(0, i-1) : '', 'pack'); }
    if(kind === 'meta') add(dirOf(path), 'meta');
    if(kind === 'func' || kind === 'text' || kind === 'nbt'){
      const dm = ('/' + path).match(/^(.*?)\/data\/[^\/]+\/(?:functions?|advancements?|loot_tables?|predicates?|dialogs?|item_modifiers?|recipes?|tags|structures?)\//i);
      if(dm) add(dm[1].slice(1), 'datapack');
    }
  }
  const list = [];
  for(const s of roots.values()){
    let type = s.tags.has('map') ? 'map' : s.tags.has('pack') ? 'pack' : s.tags.has('datapack') ? 'datapack' : null;
    if(!type){ // only a pack.mcmeta: decide by what sits beside it
      if(S.paths.some(p => p.path.startsWith(s.root + '/assets/'))) type = 'pack';
      else if(S.paths.some(p => p.path.startsWith(s.root + '/data/'))) type = 'datapack';
      else continue;
    }
    const h = S.hints.get(s.root) || {};
    const last = s.root.split('/').pop() || tr('（根目錄）');
    list.push({root:s.root, type, name: h.name || last.replace(/\.zip$/i, ''), file: last, desc: h.desc || '', hasMeta: s.tags.has('meta')});
  }
  // parent = nearest enclosing source
  for(const s of list){
    let best = null;
    for(const o of list) if(o !== s && o.root !== s.root && under(s.root, o.root) && (!best || o.root.length > best.root.length)) best = o;
    s.parent = best;
  }
  const realLang = [...S.files.values()].filter(f => !f.isNew);
  for(const s of list){
    const deeper = list.filter(o => o !== s && under(o.root, s.root) && o.root !== s.root);
    const own = p => under(p, s.root) && !deeper.some(o => o.type === s.type && under(p, o.root));
    if(s.type === 'map'){
      const keys = new Set();
      for(const [k, us] of S.usages) if(us.some(u => under(u.where, s.root))) keys.add(k);
      s.keys = keys;
      s.scanned = S.paths.filter(p => SCAN_KINDS.has(p.kind) && under(p.path, s.root)).length;
      s.regions = S.paths.filter(p => p.kind === 'region' && under(p.path, s.root)).length;
      s.datapacks = list.filter(o => o.type === 'datapack' && o.parent === s).length;
      s.undef = [...keys].filter(k => !Object.values(S.langs).some(l => l.entries.has(k)) && !isIgnored(k));
      s.packs = list.filter(o => o.type === 'pack' && under(o.root, s.root) && o !== s);
    } else if(s.type === 'pack'){
      s.langFiles = realLang.filter(f => own(f.path));
      s.codes = [...new Set(s.langFiles.map(f => f.code))].sort();
      s.nkeys = s.langFiles.reduce((a, f) => a + nodesIn(S.langs[f.code], f.path).length, 0);
    } else {
      const keys = new Set();
      for(const [k, us] of S.usages) if(us.some(u => under(u.where, s.root))) keys.add(k);

function edIndex(root, node, off){
  const r = document.createRange(); r.setStart(root, 0);
  try{ r.setEnd(node, off); }catch(e){ return 0; }
  const d = document.createElement('div'); d.appendChild(r.cloneContents());
  return readEd(d).length;
}
function edPoint(root, i){
  let n = 0; const kids = [...root.childNodes];
  for(let x = 0; x < kids.length; x++){
    const c = kids[x];
    if(c.nodeType === 1 && (c.dataset.raw || c.tagName === 'BR')){
      if(c.dataset.end) return [root, x];
      if(i <= n) return [root, x];
      n++; continue;
    }
    const tn = c.nodeType === 3 ? c : c.firstChild;
    const L = tn && tn.nodeType === 3 ? tn.data.length : 0;
    if(tn && i <= n + L) return [tn, i - n];
    n += L;
  }
  return [root, kids.length];
}
function edGetSel(){
  const ed = S.editing; if(!ed) return [0, 0];
  if(ed.mode === 'raw'){ const ta = $('#cell-editor'); return ta ? [ta.selectionStart, ta.selectionEnd] : [0, 0]; }
  const root = $('#ed-ce'), s = getSelection();
  if(root && s.rangeCount && root.contains(s.anchorNode) && root.contains(s.focusNode)){
    const r = s.getRangeAt(0);
    const a = edIndex(root, r.startContainer, r.startOffset), b = edIndex(root, r.endContainer, r.endOffset);
    return [Math.min(a, b), Math.max(a, b)];
  }
  if(ed.sel) return ed.sel;
  const n = parseEd(ed.draft).length; return [n, n];
}
function edSetSel(a, b){
  const ed = S.editing; if(!ed) return;
  if(b === undefined) b = a;
  if(ed.mode === 'raw'){ const ta = $('#cell-editor'); if(ta){ ta.focus({preventScroll:true}); ta.setSelectionRange(a, b); } ed.sel = [a, b]; return; }
  const root = $('#ed-ce'); if(!root) return;
  const n = parseEd(ed.draft).length; a = Math.max(0, Math.min(a, n)); b = Math.max(0, Math.min(b, n));
  root.focus({preventScroll:true});
  const [an, ao] = edPoint(root, a), [bn, bo] = edPoint(root, b);
  const s = getSelection(); s.removeAllRanges(); const r = document.createRange();
  r.setStart(an, ao); r.setEnd(bn, bo); s.addRange(r);
  ed.sel = [a, b];
}
function caretStyle(chars, a, b){
  const ed = S.editing;
  if(ed && ed.pending && a === b) return ed.pending;
  a = Math.min(a, chars.length); b = Math.min(b, chars.length);
  if(a !== b && chars[a]) return chars[a].st;
  return a > 0 ? chars[a-1].st : (chars[0] ? chars[0].st : {});
}

/* per-cell undo history: one stack per language + key, kept while the page is open */
const HIST = new Map();
function histFor(c, k){ const id = c + '\u0001' + k; let h = HIST.get(id); if(!h){ h = {stack:[], i:-1, t:0, kind:null}; HIST.set(id, h); } return h; }
function histPush(h, v, kind){
  if(h.i >= 0 && h.stack[h.i] === v) return;
  const now = Date.now();
  h.stack.length = h.i + 1;
  if(kind === 'type' && h.kind === 'type' && now - h.t < 900 && h.i > 0) h.stack[h.i] = v;
  else { h.stack.push(v); h.i++; if(h.stack.length > 300){ h.stack.shift(); h.i--; } }
  h.t = now; h.kind = kind;
}
function histGo(d){
  const ed = S.editing; if(!ed) return;
  const h = histFor(ed.c, ed.k), j = h.i + d;
  if(j < 0 || j >= h.stack.length) return;
  h.i = j; h.kind = null; ed.draft = h.stack[j]; ed.pending = null;
  const n = ed.mode === 'raw' ? ed.draft.length : parseEd(ed.draft).length;
  edPaint([n, n]);
}

function cellEditorHTML(k, c){
  const ed = S.editing, label = T`${esc(c)} 的 ${esc(k)}`;
  if(ed.mode === 'raw') return `<textarea id="cell-editor" rows="2" spellcheck="false" aria-label="${label}">${esc(ed.draft)}</textarea><div class="chat ed-pv" id="ed-pv">${renderMC(ed.draft, false, baseHex(k))}</div>`;
  const chars = parseEd(ed.draft);
  return `<div class="chat ed-ce${chars.length ? '' : ' is-empty'}" id="ed-ce" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="${label}" data-ph="${tr('輸入文字')}">${renderEd(chars, baseHex(k))}</div>`;
}
function afterEditorRender(){
  const ed = S.editing; if(!ed) return;
  if(ed.mode === 'raw') autoGrow($('#cell-editor'));
  const n = ed.mode === 'raw' ? ed.draft.length : parseEd(ed.draft).length;
  let sel = ed.caret != null ? [ed.caret, ed.caret] : (ed.sel || [n, n]);
  ed.caret = null;
  edSetSel(Math.min(sel[0], n), Math.min(sel[1], n));
  renderEdbar(); placeFloat();
}
function autoGrow(ta){ if(!ta) return; ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
// repaint the open editor after the draft changed, keeping the caret
function edPaint(sel){
  const ed = S.editing; if(!ed) return;
  if(ed.mode === 'raw'){
    const ta = $('#cell-editor'); if(!ta) return;
    if(ta.value !== ed.draft) ta.value = ed.draft;
    autoGrow(ta);
    $('#ed-pv').innerHTML = renderMC(ed.draft, false, baseHex(ed.k));
    if(sel) edSetSel(sel[0], sel[1]);
  } else {
    const root = $('#ed-ce'); if(!root) return;
    const chars = parseEd(ed.draft);
    root.innerHTML = renderEd(chars, baseHex(ed.k));
    root.classList.toggle('is-empty', !chars.length);
    if(sel) edSetSel(sel[0], sel[1]);
  }
  renderEdbar(); placeFloat();
}
function edSet(src, kind, sel){
  const ed = S.editing; if(!ed) return;
  if(src !== ed.draft){ ed.draft = src; histPush(histFor(ed.c, ed.k), src, kind); }
  edPaint(sel);
}
function edReplace(a, b, ins, kind){
  const ed = S.editing, old = parseEd(ed.draft);
  const neu = old.slice(0, a).map(bare).concat(ins, old.slice(b).map(bare));
  ed.pending = null;
  edSet(spliceEd(ed.draft, old, neu), kind, [a + ins.length, a + ins.length]);
}
function edInsertText(text, kind){
  const ed = S.editing; if(!ed) return;
  text = text.replace(/\r\n?/g, '\n');
  if(ed.mode === 'raw'){ rawInsert(text); return; }
  const [a, b] = edGetSel(), chars = parseEd(ed.draft), st = caretStyle(chars, a, b);
  edReplace(a, b, [...text].flatMap(ch => [...ch].map(u => ({t:u, st}))), kind || 'type');
}
// pasted text keeps its § codes: they become colors instead of literal characters
function edPasteText(text){
  const ed = S.editing; if(!ed) return;
  text = text.replace(/\r\n?/g, '\n');
  if(ed.mode === 'raw'){ rawInsert(text); return; }
  const [a, b] = edGetSel(), chars = parseEd(ed.draft), st = caretStyle(chars, a, b);
  edReplace(a, b, parseEd(text, st).map(bare), 'paste');
}
function edDelete(dir){
  const ed = S.editing, chars = parseEd(ed.draft);
  let [a, b] = edGetSel();
  if(a === b){
    if(dir < 0){ if(!a) return; a--; if(a > 0 && /[\udc00-\udfff]/.test(chars[a].t) && /[\ud800-\udbff]/.test(chars[a-1].t)) a--; }
    else { if(b >= chars.length) return; b++; if(b < chars.length && /[\udc00-\udfff]/.test(chars[b].t) && /[\ud800-\udbff]/.test(chars[b-1].t)) b++; }
  }
  edReplace(a, b, [], 'type');
}
function syncFromDom(){
  const ed = S.editing, root = $('#ed-ce'); if(!ed || !root) return;
  const sel = edGetSel();
  const old = parseEd(ed.draft), neu = readEd(root);
  edSet(spliceEd(ed.draft, old, neu), 'type', sel);
}
// color / format from the toolbar
function edColor(ch){
  const ed = S.editing; if(!ed) return;
  if(ed.mode === 'raw'){ rawCode(ch); return; }
  const [a, b] = edGetSel(), chars = parseEd(ed.draft);
  const mod = st => ch === 'r' ? {} : {...st, c:ch};
  if(a === b){ ed.pending = mod(caretStyle(chars, a, b)); edSetSel(a); renderEdbar(); return; }
  const neu = chars.map((x, i) => i >= a && i < b ? {...bare(x), st: mod(x.st)} : bare(x));
  ed.pending = null;
  edSet(spliceEd(ed.draft, chars, neu), 'style', [a, b]);
}
function edFormat(f){
  const ed = S.editing; if(!ed) return;
  if(ed.mode === 'raw'){ rawCode(f); return; }
  const [a, b] = edGetSel(), chars = parseEd(ed.draft);
  if(a === b){ const st = {...caretStyle(chars, a, b)}; if(st[f]) delete st[f]; else st[f] = 1; ed.pending = st; edSetSel(a); renderEdbar(); return; }
  const all = chars.slice(a, b).every(x => x.st[f]);
  const neu = chars.map((x, i) => { if(i < a || i >= b) return bare(x); const st = {...x.st}; if(all) delete st[f]; else st[f] = 1; return {...bare(x), st}; });
  ed.pending = null;
  edSet(spliceEd(ed.draft, chars, neu), 'style', [a, b]);
}
function edPlaceholder(){
  const ed = S.editing; if(!ed) return;
  if(ed.mode === 'raw'){ rawInsert('%s'); return; }
  const [a, b] = edGetSel(), chars = parseEd(ed.draft);
  edReplace(a, b, [{t:'%s', atom:true, st:caretStyle(chars, a, b)}], 'style');
}
function rawInsert(text){
  const ed = S.editing, ta = $('#cell-editor'); if(!ta) return;
  const a = ta.selectionStart, b = ta.selectionEnd;
  edSet(ed.draft.slice(0, a) + text + ed.draft.slice(b), 'style', [a + text.length, a + text.length]);
}
// raw mode: a color right after the caret's color code replaces that code; a selection gets wrapped
function rawCode(ch){
  const ed = S.editing, ta = $('#cell-editor'); if(!ta) return;
  const v = ed.draft, a = ta.selectionStart, b = ta.selectionEnd, P = pfxOf(v);
  if(a === b && a >= 2 && /[§&]/.test(v[a-2]) && /[0-9a-fk-or]/i.test(v[a-1]) && (COLOR[v[a-1].toLowerCase()] || v[a-1].toLowerCase() === 'r') && (COLOR[ch] || ch === 'r')){
    edSet(v.slice(0, a-2) + v[a-2] + ch + v.slice(a), 'style', [a, a]); return;
  }
  if(a !== b){ const w = P + ch + v.slice(a, b) + (ch === 'r' ? '' : P + 'r'); edSet(v.slice(0, a) + w + v.slice(b), 'style', [a, a + w.length]); return; }

  let at = a;
  if(COLOR[ch]) while(at >= 2 && /[§&]/.test(v[at-2]) && /[k-o]/i.test(v[at-1])) at -= 2;
  edSet(v.slice(0, at) + P + ch + v.slice(at), 'style', [a + 2, a + 2]);
}
function baseValue(k){ const b = S.langs[S.base] && S.langs[S.base].entries.get(k); return b ? b.v : null; }
function edFillBase(){
  const ed = S.editing; if(!ed) return;
  const v = baseValue(ed.k); if(v == null || ed.c === S.base) return;
  const n = ed.mode === 'raw' ? v.length : parseEd(v).length;
  ed.pending = null; edSet(v, 'fill', [n, n]);
}
function fillBase(k, c){
  if(c === S.base || baseValue(k) == null) return;
  openEditor(k, c); edFillBase(); toast(tr('已填入基準，Ctrl+Z 可以復原'));
}

function openEditor(k, c, caret){
  if(S.editing){ if(S.editing.k === k && S.editing.c === c) return; commitEditor(true); }
  const e = S.langs[c] && S.langs[c].entries.get(k);
  const draft = e ? e.v : '';
  S.editing = {k, c, draft, saved: draft, mode: S.view === 'raw' ? 'raw' : 'wys', pending: null, caret: caret == null ? null : caret, sel: null};
  histPush(histFor(c, k), draft, 'open');
  renderTable();
}
function commitEditor(silent){
  const ed = S.editing; if(!ed) return;
  if(ed.mode === 'wys' && ed.composing) syncFromDom();
  const {k, c, draft} = ed;
  const lang = ensureLang(c), e = lang.entries.get(k);
  let changed = false;
  if(e){ if(e.v !== draft){ e.v = draft; changed = true; } }
  else if(draft !== ''){ lang.entries.set(k, {v:draft, orig:undefined, file:fileFor(c)}); changed = true; }
  S.editing = null; hideFloat();
  if(changed){ S.sticky.add(k); S.lastEdit = {k, c, t: Date.now()}; }
  renderSide(); renderTable();
  if(changed && !silent) toast(tr('已儲存，記得匯出語言檔'));
}
function cancelEditor(){
  const ed = S.editing; if(!ed) return;
  if(ed.draft !== ed.saved) histPush(histFor(ed.c, ed.k), ed.saved, 'cancel');
  S.editing = null; hideFloat(); renderTable();
}

/* toolbar above the table */
function buildEdbar(){
  const pal = MC.map(([ch, h, n]) => `<button type="button" class="swb" style="--sw:#${h}" data-ec="${ch}" title="${S.pfx}${ch} ${tr(n)}" aria-label="${tr(n)}"></button>`).join('');
  const fm = [['l','B','font-weight:700','Ctrl+B'],['o','I','font-style:italic','Ctrl+I'],['n','U','text-decoration:underline','Ctrl+U'],['m','S','text-decoration:line-through',''],['k','?','','']]
    .map(([f, label, css, key]) => `<button type="button" class="fb" data-ef="${f}" title="${S.pfx}${f} ${tr(FMT[f])}${key ? ' · ' + key : ''}" aria-label="${tr(FMT[f])}" aria-pressed="false" style="${css}">${label}</button>`).join('');
  $('#edbar').innerHTML = `<div class="eb-group eb-pal" role="group" aria-label="${tr('顏色')}">${pal}</div>
    <div class="eb-group" role="group" aria-label="${tr('格式')}">${fm}<button type="button" class="fb" data-ec="r" title="${tr('清除顏色與格式')}" aria-label="${tr('清除顏色與格式')}">↺</button></div>
    <div class="eb-group"><button type="button" class="fb mono" data-ea="ph" title="${tr('插入 %s 佔位符')}">%s</button></div>
    <div class="eb-group"><button type="button" class="fb" data-ea="undo" title="${tr('復原')} · Ctrl+Z" aria-label="${tr('復原')}">${ico('undo')}</button><button type="button" class="fb" data-ea="redo" title="${tr('重做')} · Ctrl+Y" aria-label="${tr('重做')}">${ico('redo')}</button></div>
    <div class="eb-group"><button type="button" class="fb wide" data-ea="fill" title="${tr('用基準語言的文字取代')}">${ico('fill')}<span>${tr('填入基準')}</span></button></div>
    <span class="eb-hint" id="eb-hint"></span>`;
  renderEdbar();
}
function renderEdbar(){
  const bar = $('#edbar'); if(!bar || !bar.firstChild) return;
  const ed = S.editing;
  bar.classList.toggle('off', !ed);
  bar.querySelectorAll('button').forEach(b => { b.disabled = !ed; b.classList.remove('on'); if(b.dataset.ef) b.setAttribute('aria-pressed', 'false'); });
  const hint = $('#eb-hint');
  if(!ed){ hint.textContent = tr('點一下格子開始編輯'); return; }
  const h = histFor(ed.c, ed.k);
  bar.querySelector('[data-ea="undo"]').disabled = h.i <= 0;
  bar.querySelector('[data-ea="redo"]').disabled = h.i >= h.stack.length - 1;
  const bv = baseValue(ed.k);
  bar.querySelector('[data-ea="fill"]').disabled = ed.c === S.base || bv == null || bv === ed.draft;
  if(ed.mode === 'raw'){ hint.textContent = tr('游標停在色碼後面時，點顏色會直接替換'); return; }
  const chars = parseEd(ed.draft), L = chars.length, [a, b] = (ed.sel || [L, L]).map(x => Math.min(x, L));
  const sts = a === b ? [caretStyle(chars, a, b)] : chars.slice(a, b).map(x => x.st);
  const c0 = sts.length ? sts[0].c : null;
  if(c0 && sts.every(s => s.c === c0)){ const sw = bar.querySelector(`[data-ec="${c0}"]`); if(sw) sw.classList.add('on'); }
  for(const f of FLAGS){ if(sts.length && sts.every(s => s[f])){ const fb = bar.querySelector(`[data-ef="${f}"]`); fb.classList.add('on'); fb.setAttribute('aria-pressed', 'true'); } }
  hint.textContent = a === b ? tr('反白文字後套用顏色或格式') : T`已選取 ${b - a} 個字`;
}
/* save / cancel buttons that follow the cell */
function placeFloat(){
  const fl = $('#edfloat'), td = document.querySelector('#grid td.cell.editing');
  if(!S.editing || !td){ fl.hidden = true; return; }
  fl.hidden = false;
  const w = $('#grid-wrap').getBoundingClientRect(), r = td.getBoundingClientRect();
  const fw = fl.offsetWidth, fh = fl.offsetHeight;
  if(r.bottom < w.top + 30 || r.top > w.bottom - 10){ fl.style.visibility = 'hidden'; return; }
  fl.style.visibility = '';
  const top = Math.max(r.top + 4, Math.min(r.bottom + 4, w.bottom - fh - 6));
  const left = Math.max(w.left + 4, Math.min(r.right - fw, w.right - fw - 6));
  fl.style.top = top + 'px'; fl.style.left = left + 'px';
}
function hideFloat(){ const fl = $('#edfloat'); if(fl) fl.hidden = true; }
// where in the text a click landed, so the caret starts there
function caretFromPoint(td, x, y){
  const box = td.querySelector('.chat:not(.none), .rawv'); if(!box) return null;
  let node = null, off = 0;
  if(document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(x, y); if(p){ node = p.offsetNode; off = p.offset; } }
  else if(document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(x, y); if(r){ node = r.startContainer; off = r.startOffset; } }
  if(!node || !box.contains(node)) return null;
  const pre = document.createRange(); pre.setStart(box, 0);
  try{ pre.setEnd(node, off); }catch(e){ return null; }
  const d = document.createElement('div'); d.appendChild(pre.cloneContents());
  if(box.classList.contains('rawv')) return d.textContent.length;
  if(d.querySelector('.empty')) return 0;
  let n = d.textContent.length;
  d.querySelectorAll('.ph').forEach(p => { n -= p.textContent.length - 1; });
  return n;
}
/* keep the viewed row in place when switching preview / raw */
function rowOf(k){ return [...document.querySelectorAll('#grid tr[data-k]')].find(r => r.dataset.k === k); }
function viewAnchor(){
  const wrap = $('#grid-wrap'), w = wrap.getBoundingClientRect();
  const head = wrap.querySelector('thead'); const top = w.top + (head ? head.offsetHeight : 0);
  const le = S.lastEdit && Date.now() - S.lastEdit.t < 5 * 60000 ? S.lastEdit : null;
  if(le){ const row = rowOf(le.k); if(row){ const r = row.getBoundingClientRect(); if(r.bottom > top && r.top < w.bottom) return {k:le.k, c:le.c, off:r.top - w.top, flash:true}; } }
  for(const row of wrap.querySelectorAll('tr[data-k]')){ const r = row.getBoundingClientRect(); if(r.bottom > top + 4) return {k:row.dataset.k, off:r.top - w.top}; }
  return null;
}
function restoreAnchor(a){
  if(!a) return;
  const wrap = $('#grid-wrap'), row = rowOf(a.k); if(!row) return;
  wrap.scrollTop += row.getBoundingClientRect().top - wrap.getBoundingClientRect().top - a.off;
  if(a.flash){ const td = [...row.querySelectorAll('td.cell')].find(t => t.dataset.c === a.c); if(td){ td.classList.remove('flash'); void td.offsetWidth; td.classList.add('flash'); setTimeout(() => td.classList.remove('flash'), 1400); } }
}

function closePop(){ $('#pop').hidden = true; S.pop = null; }

/* ---------- export ---------- */
const EXT = {json:'.json', yaml:'.yml', lang:'.lang'};
const outFmt = f => (S.expFmt && S.expFmt !== 'keep') ? S.expFmt : f.format;
const outName = (p, f) => p.replace(/\.(json|lang|ya?ml)$/i, '') + (outFmt(f) === f.format ? (p.match(/\.(json|lang|ya?ml)$/i) || ['.json'])[0] : EXT[outFmt(f)]);
function toYaml(file, keys, get){
  const lists = new Set(file.lists || []);
  const val = k => lists.has(k) ? get(k).split('\n') : get(k);
  let obj = {};
  let nest = !!file.nested;
  if(nest){ // nest by dots unless a key is also a prefix of another key
    const set = new Set(keys);
    if(keys.some(k => k.split('.').slice(0, -1).some((_, i, a) => set.has(a.slice(0, i+1).join('.'))))) nest = false;
  }
  if(nest){
    for(const k of keys){ const parts = k.split('.'); let o = obj; parts.slice(0, -1).forEach(p => { if(!o[p] || typeof o[p] !== 'object' || Array.isArray(o[p])) o[p] = {}; o = o[p]; }); o[parts[parts.length-1]] = val(k); }
  } else for(const k of keys) obj[k] = val(k);
  const ind = typeof file.indent === 'number' ? file.indent : 2;
  return window.YAML ? YAML.stringify(obj, {lineWidth: 0, indent: ind}) : jsyaml.dump(obj, {lineWidth: -1, noRefs: true, quotingType: '"', indent: ind});
}
function pruneEmpty(doc, p){
  while(p.length){ const n = doc.getIn(p, true); if(YAML.isMap(n) && !n.items.length){ doc.deleteIn(p); p = p.slice(0, -1); } else break; }
}
function patchYaml(file, keys, lang){
  const doc = YAML.parseDocument(file.srcText);
  const lists = new Set(file.lists || []), paths = file.paths || {};
  const pathOf = k => paths[k] || (file.nested ? k.split('.') : [k]);
  const present = new Set(keys);
  for(const k of file.order) if(!present.has(k)){ const p = pathOf(k); doc.deleteIn(p); pruneEmpty(doc, p.slice(0, -1)); }
  for(const k of keys){
    const e = lang.entries.get(k); if(e.v === e.orig) continue;
    const p = pathOf(k), val = lists.has(k) ? e.v.split('\n') : e.v;
    const node = doc.getIn(p, true);
    if(!Array.isArray(val) && node && YAML.isScalar(node)) node.value = val;
    else doc.setIn(p, val);
  }
  return doc.toString({lineWidth: 0});
}
function patchLang(file, keys, lang){
  const present = new Set(keys), done = new Set(), out = [];
  const line = k => `${k}=${lang.entries.get(k).v.replace(/\n/g, '\\n')}`;
  for(const l of file.srcText.split(/\r?\n/)){
    const i = l.indexOf('=');
    if(!l || l.startsWith('#') || i < 1){ out.push(l); continue; }
    const k = l.slice(0, i);
    if(!present.has(k) || done.has(k)) continue;
    done.add(k); out.push(line(k));
  }
  while(out.length && out[out.length-1] === '') out.pop();
  for(const k of keys) if(!done.has(k)) out.push(line(k));
  return out.join(file.eol || '\n') + (file.eol || '\n');
}
function serialize(file, fmt){
  fmt = fmt || file.format;
  const lang = S.langs[file.code]; if(!lang) return '';
  const keys = []; const seen = new Set();
  const nodes = new Map(nodesIn(lang, file.path)); const view = {entries: nodes};
  for(const k of file.order){ if(nodes.has(k) && !seen.has(k)){ keys.push(k); seen.add(k); } }
  for(const k of nodes.keys()) if(!seen.has(k)){ keys.push(k); seen.add(k); }
  if(fmt === 'yaml' && file.format === 'yaml' && file.srcText != null && window.YAML){
    try{ return patchYaml(file, keys, view); }catch(e){ console.warn('YAML patch failed, rewriting', e); }
  }
  if(fmt === 'lang' && file.format === 'lang' && file.srcText != null) return patchLang(file, keys, view);
  if(fmt === 'lang') return keys.map(k => `${k}=${nodes.get(k).v.replace(/\n/g, '\\n')}`).join('\n') + '\n';
  if(fmt === 'yaml') return toYaml(file, keys, k => nodes.get(k).v);
  const obj = {}; for(const k of keys) obj[k] = nodes.get(k).v;
  return JSON.stringify(obj, null, fmt === file.format ? file.indent : 2) + '\n';
}
function fileDirty(file){
  const lang = S.langs[file.code]; if(!lang) return 0;
  const ns = nodesIn(lang, file.path); let n = 0; for(const [, e] of ns) if(e.v !== e.orig) n++;
  const present = new Set(ns.map(([k]) => k));
  n += file.order.filter(k => !present.has(k)).length;

}

async function saveFile(filename, data){
  if(!S.dl){ toast(tr('這個檢視無法下載，請改用複製')); return false; }

  catch(e){
    const code = e && e.code;
    if(code === 'declined') toast(tr('已取消下載'));
    else if(code === 'rate_limited') toast(tr('已有一個下載視窗開著，請稍後再試'));
    else toast(T`無法下載：${(e && e.message) || code || tr('未知錯誤')}`);
    return false;

}
function markExported(paths){
  for(const p of paths){ const t = S.texts.get(p); if(t) t.orig = t.text; }
  for(const p of paths){ const f = S.files.get(p); if(f && f.srcText != null) f.srcText = serialize(f); }
  for(const p of paths){ const f = S.files.get(p); if(!f) continue; const lang = S.langs[f.code];
    const ns = nodesIn(lang, p); for(const [, e] of ns) e.orig = e.v;
    f.order = ns.map(([k]) => k); f.isNew = false; }
  S.deleted = 0; renderSide(); renderTable();
}
async function handleExport(act, i){
  const m = $('#modal'), files = m._files || [], texts = m._texts || [];
  if(act === 'close'){ m.hidden = true; return; }
  if(act === 'tcopy'){
    const text = S.texts.get(texts[i]).text;
    try{ await navigator.clipboard.writeText(text); toast(T`已複製 ${texts[i].split('/').pop()}`); }
    catch(e){ const ta = $('#exp-text'); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); toast(tr('無法直接複製，內容已選取，請按 Ctrl+C')); }
    return;
  }
  if(act === 'tdl'){ const p = texts[i]; if(await saveFile(p.split('/').pop(), S.texts.get(p).text)){ markExported([p]); openExport(); } return; }
  if(act === 'write' || act === 'twrite' || act === 'writeall'){
    const jobs = [];
    if(act === 'write') jobs.push([files[i].path, () => serialize(files[i]), !!files[i].isNew]);
    else if(act === 'twrite') jobs.push([texts[i], () => S.texts.get(texts[i]).text, false]);
    else {
      for(const f of files) if(canWrite(f) && (fileDirty(f) || f.isNew)) jobs.push([f.path, () => serialize(f), !!f.isNew]);
      for(const p of texts) if(S.handles.has(p)) jobs.push([p, () => S.texts.get(p).text, false]);
    }
    if(!jobs.length){ toast(tr('沒有需要存回的修改')); return; }
    const ok = [];
    for(const [p, get, create] of jobs){ try{ await writeHandle(p, get(), create); ok.push(p); }catch(e){ toast(T`無法寫入 ${p.split('/').pop()}：${e.message || e}`); } }
    if(ok.length){ markExported(ok); toast(T`已存回 ${ok.length} 個檔案`); openExport(); }
    return;
  }
  if(act === 'copy'){
    const text = serialize(files[i], outFmt(files[i]));
    try{ await navigator.clipboard.writeText(text); toast(T`已複製 ${files[i].path.split('/').pop()}`); }
    catch(e){ const ta = $('#exp-text'); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); toast(tr('無法直接複製，內容已選取，請按 Ctrl+C')); }
    return;
  }
  if(act === 'dl'){ const f = files[i]; if(await saveFile(outName(f.path, f).split('/').pop(), serialize(f, outFmt(f)))){ markExported([f.path]); openExport(); } return; }
  if(act === 'zip'){
    const zip = new JSZip(); const used = new Set();
    for(const f of files){ let p = zipName(f); let n = 2; while(used.has(p)){ p = zipName(f).replace(/(\.\w+)$/, `-${n++}$1`); } used.add(p); zip.file(p, serialize(f, outFmt(f))); }
    for(const p of texts) zip.file(mapZipPath(p), S.texts.get(p).text);
    const blob = await zip.generateAsync({type:'blob'});
    if(await saveFile('lang-export.zip', blob)){ markExported([...files.map(f => f.path), ...texts]); m.hidden = true; }
  }
}

// IndexedDB
function idb(){
  if(idb._p) return idb._p;
  idb._p = new Promise((res, rej) => {
    try{ const r = indexedDB.open('lang-key-workbench', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
  return idb._p;
}
async function idbDo(mode, fn){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', mode); const req = fn(tx.objectStore('kv')); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }

async function projSave(){
  clearTimeout(S._as); S._as = null;
  if(!PROJ.cur || S.sample) return;
  const meta = projMeta(PROJ.cur); if(!meta) return;
  if(meta.auto){ const n = autoName(); if(n) meta.name = n; }
  const keep = new Set([...S.files.keys(), ...S.texts.keys()]);
  const rec = {id: meta.id, data: snapshot(), handles: [...S.handles].filter(([p]) => keep.has(p)), dirs: [...S.dirs]};
  meta.savedAt = Date.now(); meta.dirty = dirtyCount();
  try{ await idbDo('readwrite', st => st.put(rec, 'p:' + meta.id)); S.autosaveFailed = false; }
  catch(e){
    // some browsers can't store folder permissions: keep the data anyway
    try{ rec.handles = []; rec.dirs = []; await idbDo('readwrite', st => st.put(rec, 'p:' + meta.id)); S.autosaveFailed = false; }
    catch(e2){ S.autosaveFailed = true; }

async function openFolder(){

});
document.addEventListener('selectionchange', () => {
  const ed = S.editing; if(!ed) return;
  const el = ed.mode === 'raw' ? $('#cell-editor') : $('#ed-ce');
  if(!el || !(document.activeElement === el || el.contains(document.activeElement))) return;
  ed.sel = edGetSel(); renderEdbar();
});
$('#edbar').addEventListener('mousedown', e => { if(e.target.closest('button')) e.preventDefault(); });
$('#edbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled || !S.editing) return;
  if(b.dataset.ec) edColor(b.dataset.ec);
  else if(b.dataset.ef) edFormat(b.dataset.ef);
  else if(b.dataset.ea === 'ph') edPlaceholder();
  else if(b.dataset.ea === 'undo') histGo(-1);
  else if(b.dataset.ea === 'redo') histGo(1);
  else if(b.dataset.ea === 'fill') edFillBase();
});
$('#edfloat').addEventListener('mousedown', e => e.preventDefault());
$('#edfloat').addEventListener('click', e => { const b = e.target.closest('[data-fa]'); if(!b) return; if(b.dataset.fa === 'save') commitEditor(false); else cancelEditor(); });
$('#grid-wrap').addEventListener('scroll', placeFloat, {passive:true});
window.addEventListener('resize', placeFloat);
window.addEventListener('scroll', placeFloat, {passive:true});

$('#pop').addEventListener('click', e => {
  const cp = e.target.closest('[data-cpal]'); if(cp){ applyComp(cp.dataset.cpal); return; }
  if(e.target.closest('[data-pact="capply"]')){ applyComp($('#pop-hex').value.trim()); return; }
  if(e.target.closest('[data-pact="cremove"]')){ applyComp(null); return; }
});
$('#pop').addEventListener('input', e => {
  if(e.target.id === 'pop-color') $('#pop-hex').value = e.target.value;
  if(e.target.id === 'pop-hex' && /^#?[0-9a-fA-F]{6}$/.test(e.target.value.trim())) $('#pop-color').value = '#' + e.target.value.trim().replace('#','').toLowerCase();
});
$('#pop').addEventListener('keydown', e => { if(e.key === 'Enter' && S.pop && S.pop.mode.type === 'comp'){ e.preventDefault(); applyComp($('#pop-hex').value.trim()); } if(e.key === 'Escape') closePop(); });
document.addEventListener('mousedown', e => { if(!$('#pop').hidden && !e.target.closest('#pop') && !e.target.closest('[data-act="ucolor"]')) closePop(); });

$('#modal').addEventListener('click', e => {
  if(e.target.id === 'modal'){ $('#modal').hidden = true; return; }
  const x = e.target.closest('[data-exp]'); if(x){ handleExport(x.dataset.exp, +x.dataset.i); return; }
  const a = e.target.closest('[data-ak]'); if(a){ if(a.dataset.ak === 'ok') addKey(); else $('#modal').hidden = true; }
});
$('#modal').addEventListener('change', e => { if(e.target.id === 'exp-fmt'){ S.expFmt = e.target.value; openExport(); } });
$('#modal').addEventListener('keydown', e => { if(e.key === 'Escape') $('#modal').hidden = true; if(e.key === 'Enter' && e.target.id === 'ak-key') addKey(); });

let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if(hasFiles(e)){ dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', e => { if(!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) $('#drop').hidden = true; });
window.addEventListener('dragover', e => { if(hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', async e => { if(!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; const items = await itemsFromDrop(e.dataTransfer); ingest(items); });

/* ---------- boot ---------- */
document.querySelectorAll('i[data-ic]').forEach(el => { el.outerHTML = ico(el.dataset.ic); });
applyStatic();
buildEdbar();
loadSample();
renderAll();
renderProjects();
(async () => {
  await projLoadIndex();
  // the single autosave from earlier versions becomes a project
  try{
    const old = await idbDo('readonly', st => st.get('session'));
    if(old && old.data && ((old.data.files || []).length || (old.data.usages || []).length)){
      restoreSession(old.data); projCreate(''); await projSave();
      await idbDo('readwrite', st => st.delete('session'));
      renderProjects(); toast(tr('上次的自動暫存已轉成專案'));
      return;
    }
  }catch(e){}
  if(PROJ.last && projMeta(PROJ.last)) await projOpen(PROJ.last, true);
  renderProjects(); updateAutosaveStatus();
})();
S.dl = { native: true, save: async ({filename, data}) => {
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/i.test(filename) ? 'application/json' : 'text/plain'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); return {status:'saved'};
}};
</script>

</body>
